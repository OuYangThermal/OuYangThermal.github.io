title: Thermal Management Knowledge Base
tagline: Engineering Knowledge for Thermal Interface Materials
description: Independent engineering guidance for selecting, applying, and testing thermal interface materials.
url: "https://ouyangthermal.github.io"
baseurl: ""
formspree_endpoint: "https://formspree.io/f/mwlkaybq"
lang: en
author:
  name: Ouyang Xiaohui
timezone: Asia/Shanghai
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
collections:
  articles:
    output: true
    permalink: /:path/
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - README.md
  - AGENTS.md
  - package.json
  - docs
  - scripts
  - visual-inbox
  - assets/images/source
  - vendor
