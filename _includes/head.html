<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.collection == 'articles' %}article{% else %}website{% endif %}"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ page.title | default: site.title | escape }}"><meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"><link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
{% seo title=false %}
